name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & validate
    runs-on: ubuntu-24.04
    steps:
      # Actions are pinned to full commit SHAs: this repo requires SHA pinning
      # and allows GitHub-owned actions. Keep the trailing version comments so
      # Dependabot can bump the pins.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        run: |
          PNPM_VERSION="$(node -p 'require("./package.json").packageManager')"
          npm install -g "$PNPM_VERSION"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Syntax check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Validate Worker bundle (dry run)
        run: pnpm build:dry
