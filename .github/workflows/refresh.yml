name: Refresh data

on:
  workflow_dispatch:

permissions: {}

jobs:
  refresh:
    name: Trigger dataset rebuild
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/refresh
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$REFRESH_TOKEN" ]; then
            echo "::error::Set the SITE_URL repository variable and REFRESH_TOKEN secret first."
            exit 1
          fi
          curl -fsS -X POST "$SITE_URL/api/refresh" \
            -H "Authorization: Bearer $REFRESH_TOKEN"
