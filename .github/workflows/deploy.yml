name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-24.04
    environment:
      name: production
    steps:
      # Actions are pinned to full commit SHAs: this repo requires SHA pinning
      # and allows GitHub-owned actions. Keep the trailing version comments so
      # Dependabot can bump the pins.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        run: |
          PNPM_VERSION="$(node -p 'require("./package.json").packageManager')"
          npm install -g "$PNPM_VERSION"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Inject KV namespace id
        env:
          # Accept it as either a variable or a secret (variables are tidier).
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID || secrets.KV_NAMESPACE_ID }}
        run: |
          if [ -n "$KV_NAMESPACE_ID" ]; then
            sed -i "s|REPLACE_WITH_KV_NAMESPACE_ID|$KV_NAMESPACE_ID|g" wrangler.toml
            echo "Injected KV namespace id from KV_NAMESPACE_ID."
          else
            echo "::warning::KV_NAMESPACE_ID is not set; deploying with the placeholder id."
          fi

      - name: Publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      - name: Sync REFRESH_TOKEN to the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          if [ -n "$REFRESH_TOKEN" ]; then
            printf '%s' "$REFRESH_TOKEN" | pnpm exec wrangler secret put REFRESH_TOKEN
          else
            echo "REFRESH_TOKEN not set; /api/refresh will stay localhost-only."
          fi

      - name: Warm the KV cache
        env:
          SITE_URL: ${{ vars.SITE_URL || secrets.SITE_URL }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          if [ -n "$SITE_URL" ] && [ -n "$REFRESH_TOKEN" ]; then
            curl -fsS -X POST "$SITE_URL/api/refresh" \
              -H "Authorization: Bearer $REFRESH_TOKEN"
          else
            echo "SITE_URL or REFRESH_TOKEN not set; skipping cache warm-up."
          fi
